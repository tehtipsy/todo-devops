name: CI/CD

# One pipeline from source to a running deployment:
#
#   validate ─┐                                            ┌─> deploy     (self-hosted cluster)
#             ├─> build (backend, frontend) ─> e2e (kind) ─┤
#   test ─────┘                                            └─> deploy-aws (EKS, via OIDC)
#
# It runs when this repository changes and when the application repository
# reports a new commit on its main branch (repository_dispatch).

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:
    inputs:
      app_ref:
        description: Application repository ref (branch, tag or SHA) to build
        required: false
        default: main

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish so
  # a deployment is never interrupted half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # The application repository. Defaults to <owner>/todo-app; override with the
  # repository variable APP_REPOSITORY.
  APP_REPOSITORY: ${{ vars.APP_REPOSITORY || format('{0}/todo-app', github.repository_owner) }}
  APP_REF: ${{ github.event.client_payload.sha || inputs.app_ref || 'main' }}

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: Validate infrastructure code
    runs-on: ubuntu-latest
    steps:
      - name: Check out DevOps repository
        uses: actions/checkout@v7

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/frontend/Dockerfile

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Validate Kubernetes manifests
        run: |
          for overlay in local production aws; do
            echo "::group::overlay: ${overlay}"
            kubectl kustomize "k8s/overlays/${overlay}" |
              docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -
            echo "::endgroup::"
          done
          # Monitoring resources are CRDs (ServiceMonitor, PrometheusRule):
          # checked for well-formedness, their schemas are not bundled.
          kubectl kustomize monitoring |
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -ignore-missing-schemas -

      - name: Validate Docker Compose file
        env:
          # Placeholder values: only the structure of the file is checked.
          DB_USER: validate
          DB_PASSWORD: validate
          GRAFANA_ADMIN_PASSWORD: validate
        run: docker compose --profile monitoring config --quiet

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "${PWD}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool monitoring/dashboards/todo-backend.json > /dev/null

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff terraform

      # No AWS credentials here: providers and modules are installed, the state
      # backend is skipped, and the configuration is checked for consistency.
      - name: Validate Terraform
        run: |
          for stack in bootstrap eks; do
            echo "::group::${stack}"
            terraform -chdir="terraform/${stack}" init -backend=false -input=false
            terraform -chdir="terraform/${stack}" validate
            echo "::endgroup::"
          done

      - name: Scan Terraform for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          # Example manifests bundled inside downloaded modules are not ours.
          skip-dirs: "**/examples"
          # Accepted findings, each with its justification.
          trivyignores: terraform/.trivyignore.yaml
          exit-code: "1"

  # ---------------------------------------------------------------------------
  test:
    name: Test application
    runs-on: ubuntu-latest
    outputs:
      app_sha: ${{ steps.release.outputs.app_sha }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_registry: ${{ steps.release.outputs.image_registry }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todo
          POSTGRES_USER: todo
          # Throwaway credentials for a database that only exists for this job.
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out application repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          # Only needed when the application repository is private.
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Run tests (unit, API and PostgreSQL integration)
        working-directory: backend
        env:
          RUN_DB_TESTS: "true"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: todo
          DB_USER: todo
          DB_PASSWORD: ci-only-not-a-secret
        run: npm run test:coverage

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Compute release coordinates
        id: release
        run: |
          app_sha="$(git rev-parse HEAD)"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          # The tag identifies both inputs of the image: application commit
          # and infrastructure commit. It is immutable and traceable.
          {
            echo "app_sha=${app_sha}"
            echo "image_tag=${app_sha::7}-${GITHUB_SHA::7}"
            echo "image_registry=${REGISTRY}/${owner}"
          } >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.component }} image
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      IMAGE: ${{ needs.test.outputs.image_registry }}/todo-${{ matrix.component }}
    steps:
      - name: Check out DevOps repository
        uses: actions/checkout@v7
        with:
          path: devops

      - name: Check out application repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.APP_REPOSITORY }}
          # Exactly the commit that was tested.
          ref: ${{ needs.test.outputs.app_sha }}
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}
          path: app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.test.outputs.image_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: devops/docker/${{ matrix.component }}
          # The application source is a separate, named build context.
          build-contexts: |
            app=app
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # The image is scanned before it is published: a build with a known,
      # fixable critical vulnerability never reaches the registry.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.test.outputs.image_tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "${IMAGE}"

  # ---------------------------------------------------------------------------
  e2e:
    name: Deploy to an ephemeral cluster and smoke-test
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REGISTRY: ${{ needs.test.outputs.image_registry }}
      IMAGE_TAG: ${{ needs.test.outputs.image_tag }}
    steps:
      - name: Check out DevOps repository
        uses: actions/checkout@v7

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: todo-ci

      - name: Load the release images into the cluster
        run: |
          for component in backend frontend; do
            image="${IMAGE_REGISTRY}/todo-${component}:${IMAGE_TAG}"
            docker pull "${image}"
            kind load docker-image "${image}" --name todo-ci
          done

      - name: Deploy
        run: scripts/deploy.sh production

      - name: Smoke test
        run: |
          kubectl -n todo port-forward svc/frontend 8080:80 > /dev/null &
          sleep 3
          scripts/smoke-test.sh http://localhost:8080

      - name: Dump cluster state
        if: failure()
        run: |
          kubectl -n todo get all -o wide
          kubectl -n todo describe pods
          kubectl -n todo logs --selector app.kubernetes.io/part-of=todo --all-containers --tail=100 --prefix

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    needs: [test, build, e2e]
    # Opt-in: set the repository variable DEPLOY_ENABLED=true once a
    # self-hosted runner with access to the target cluster is registered.
    # Never runs for pull requests, so untrusted code cannot reach the runner.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: self-hosted
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE_REGISTRY: ${{ needs.test.outputs.image_registry }}
      IMAGE_TAG: ${{ needs.test.outputs.image_tag }}
    steps:
      - name: Check out DevOps repository
        uses: actions/checkout@v7

      - name: Configure cluster access
        env:
          # Optional base64-encoded kubeconfig. Without it the runner's own
          # kubectl context is used (e.g. a runner on the minikube host).
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "${KUBE_CONFIG}" ]; then
            umask 077
            echo "${KUBE_CONFIG}" | base64 -d > "${RUNNER_TEMP}/kubeconfig"
            echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "${GITHUB_ENV}"
          fi

      - name: Deploy
        env:
          # All optional: the database password is generated on first deploy,
          # and pull credentials are only needed for private images.
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_PULL_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_PULL_TOKEN }}
        run: scripts/deploy.sh production

      - name: Smoke test
        run: |
          kubectl -n todo port-forward svc/frontend 18080:80 > /dev/null &
          forward_pid=$!
          trap 'kill "${forward_pid}"' EXIT
          sleep 3
          scripts/smoke-test.sh http://localhost:18080

  # ---------------------------------------------------------------------------
  deploy-aws:
    name: Deploy to AWS (EKS)
    needs: [test, build, e2e]
    # Opt-in: set the repository variable AWS_DEPLOY_ENABLED=true after
    # `terraform apply` in terraform/eks (its outputs list every variable).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The IAM role's trust policy only accepts jobs running in this environment.
    environment:
      name: aws
      url: ${{ steps.url.outputs.app_url }}
    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token to exchange for AWS credentials.
      id-token: write
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    env:
      IMAGE_REGISTRY: ${{ needs.test.outputs.image_registry }}
      IMAGE_TAG: ${{ needs.test.outputs.image_tag }}
    steps:
      - name: Check out DevOps repository
        uses: actions/checkout@v7

      # Preferred: keyless. With AWS_ROLE_ARN set, the job trades its GitHub
      # OIDC token for credentials that expire when the job ends; no AWS key
      # exists anywhere.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      # Fallback for sandbox accounts that cannot create IAM roles (AWS Academy
      # Learner Lab): the session's temporary keys, stored as environment
      # secrets. They expire with the lab session and must be refreshed.
      - name: Configure AWS credentials (temporary keys)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_PULL_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_PULL_TOKEN }}
        run: scripts/deploy.sh aws

      - name: Smoke test
        run: |
          kubectl -n todo port-forward svc/frontend 18080:80 > /dev/null &
          forward_pid=$!
          trap 'kill "${forward_pid}"' EXIT
          sleep 3
          scripts/smoke-test.sh http://localhost:18080

      # The ALB is created asynchronously by the load balancer controller; on
      # the very first deployment its hostname can take a minute to appear.
      - name: Publish application URL
        id: url
        run: |
          for _ in $(seq 1 30); do
            host="$(kubectl -n todo get ingress todo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [ -n "${host}" ]; then
              echo "app_url=http://${host}" >> "${GITHUB_OUTPUT}"
              echo "Application URL: http://${host}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The load balancer has no hostname yet; check 'kubectl -n todo get ingress todo'."
