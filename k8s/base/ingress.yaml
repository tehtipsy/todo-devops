# Entry point from outside the cluster. All traffic goes to the Nginx frontend,
# which serves the UI and reverse-proxies /api/ to the backend - the backend
# Service itself is never exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
spec:
  ingressClassName: nginx
  rules:
    - host: todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
