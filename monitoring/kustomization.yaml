# Application-specific monitoring resources, applied on top of
# kube-prometheus-stack: kubectl apply -k monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - kubernetes/servicemonitor.yaml
  - kubernetes/prometheusrule.yaml

# The dashboard JSON is the single source of truth for both environments:
# docker-compose mounts the file, Kubernetes wraps it in this ConfigMap, which
# the Grafana sidecar picks up through the grafana_dashboard label.
configMapGenerator:
  - name: todo-backend-dashboard
    files:
      - dashboards/todo-backend.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: TODO
