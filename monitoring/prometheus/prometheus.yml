# Prometheus configuration for the docker-compose environment.
# In Kubernetes the kube-prometheus-stack operator generates the equivalent
# from monitoring/kubernetes/servicemonitor.yaml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: todo-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
