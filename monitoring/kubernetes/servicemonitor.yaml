# Tells the Prometheus Operator to scrape every backend pod behind the
# `backend` Service in the `todo` namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-backend
  labels:
    app.kubernetes.io/part-of: todo
spec:
  namespaceSelector:
    matchNames: ["todo"]
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
